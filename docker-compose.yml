services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticket_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ticket_management?schema=public
      BETTER_AUTH_SECRET: local-dev-secret-change-me
      BETTER_AUTH_URL: http://localhost:3001
      CLIENT_URL: http://localhost:5173
      INBOUND_EMAIL_WEBHOOK_SECRET: local-dev-webhook-secret
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: password1234
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-placeholder}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-placeholder}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@example.com}
      SENTRY_ENVIRONMENT: development
    ports:
      - "3001:3001"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    environment:
      PORT: 5173
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
